services:
  em-electromagnetic-leakage-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set a strong unique AUDIT_SECRET_KEY in the environment}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:?Set a strong unique API_AUTH_TOKEN in the environment}"
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
