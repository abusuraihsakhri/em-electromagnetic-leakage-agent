[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "em-electromagnetic-leakage-engine"
version = "2.0.0"
description = "Screaming Channels: RF / Electromagnetic Cryptographic Leakage Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
em-electromagnetic-leakage-engine = "cli:main"
em-leakage-frontier = "em_leakage_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/em-electromagnetic-leakage-agent"
Repository = "https://github.com/abusuraihsakhri/em-electromagnetic-leakage-agent"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment"]

[tool.setuptools.packages.find]
include = ["agents*", "em_leakage_agent*"]
